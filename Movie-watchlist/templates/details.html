{% extends "base.html" %}
{% block title %}Details - Media Hub{% endblock %}

{% block main %}
<div id="details" data-type="{{ media_type }}" data-id="{{ ext_id }}">
  <div class="hero plain" id="hero">
    <div class="wrap"><a class="btn secondary" id="back" href="/">Back</a></div>
  </div>
  <div class="wrap">
    <div class="detail" id="detail">
      <div class="art"><div class="poster"></div></div>
      <div class="info skel" aria-hidden="true">
        <div class="line" style="height:36px;width:60%"></div>
        <div class="line"></div><div class="line short"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script defer src="{{ url_for('static', filename='js/details.js') }}?v={{ v('js/details.js') }}"></script>
{% endblock %}
