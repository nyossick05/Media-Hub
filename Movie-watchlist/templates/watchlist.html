{% extends "base.html" %}
{% block title %}Watchlist - Media Hub{% endblock %}

{% block main %}
<div class="wrap">
  <div class="page-head"><h1>Watchlist</h1></div>

  <div class="toolbar" style="margin-top:0">
    <div style="flex:1 1 260px; max-width:380px">
      <label class="visually-hidden" for="wl-search">Filter your watchlist</label>
      <input class="field" id="wl-search" type="search" placeholder="Filter by title" autocomplete="off">
    </div>
    <div class="spacer">
      <label class="visually-hidden" for="wl-sort">Sort by</label>
      <select class="field" id="wl-sort">
        <option value="added">Recently added</option>
        <option value="title">Title A to Z</option>
        <option value="rating">Your rating</option>
      </select>
    </div>
  </div>

  <div class="toolbar" style="margin-top:0">
    <div class="chips" id="type-chips" role="group" aria-label="Type"></div>
  </div>
  <div class="toolbar" style="margin-top:0">
    <div class="chips" id="status-chips" role="group" aria-label="Status"></div>
  </div>

  <div class="grid" id="grid" style="margin-top:20px"></div>
</div>
{% endblock %}

{% block scripts %}
<script defer src="{{ url_for('static', filename='js/watchlist.js') }}?v={{ v('js/watchlist.js') }}"></script>
{% endblock %}
